<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>IREducation Globe</title>
  <style>
    html, body { margin: 0; overflow: hidden; height: 100%; }
    #globeViz { width: 100vw; height: 100vh; }
  </style>

  <!-- Reliable CDN versions (no module system needed) -->
  <script src="https://unpkg.com/three@0.152.2/build/three.min.js"></script>
  <script src="https://unpkg.com/globe.gl"></script>
</head>
<body>
  <div id="globeViz"></div>

  <script>
    const world = Globe()(document.getElementById('globeViz'))
      .globeImageUrl('https://cdn.jsdelivr.net/npm/three-globe/example/img/earth-blue-marble.jpg')
      .bumpImageUrl('https://cdn.jsdelivr.net/npm/three-globe/example/img/earth-topology.png')
      .labelsData([
        { lat: 51.7520, lng: -1.2577, text: "Oxford" },
        { lat: 22.3193, lng: 114.1694, text: "Hong Kong" },
        { lat: 39.9042, lng: 116.4074, text: "China" } 
      ])
      .labelColor(() => 'orange')
      .labelDotRadius(() => 0.5)
      .labelSize(() => 1.4)
      .labelAltitude(() => 0.01)
      .arcsData([
        {
          startLat: 22.3193, startLng: 114.1694, // Hong Kong
          endLat: 51.7520, endLng: -1.2577,      // Oxford
          color: ['#ff9900']
        },
        {
          startLat: 22.3193, startLng: 114.1694, // Hong Kong
          endLat: 39.9042, endLng: 116.4074,     // Beijing
          color: ['#00ccff']
        }
      ])
      .arcStroke(() => 0.5)
      .arcAltitude(() => 0.2)
      .arcDashLength(() => 0.4)
      .arcDashGap(() => 1)
      .arcDashInitialGap(() => Math.random())
      .arcDashAnimateTime(() => 4000)
      .pointOfView({ lat: 22.3193, lng: 114.1694, altitude: 1.5 }, 2000); // Start at Hong Kong

    // Auto-rotate after slight delay
    setTimeout(() => {
      const controls = world.controls();
      if (controls) {
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.30;
      }
    }, 500);
  </script>
</body>
</html>
